plugins {
    id 'java'
//    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.hibernate.orm' version '6.6.33.Final'
    id 'org.graalvm.buildtools.native' version '0.10.6'
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id "org.jreleaser" version "1.13.1"
}

group = 'io.github.MORK-RAKSA'
version = '0.0.1'
description = 'Core Spring utilities'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }

    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = "wft-core"
                description = "Core Spring utilities"
                url = "https://github.com/MORK-RAKSA/wft-core"

                licenses {
                    license {
                        name = "MIT License"
                        url = "https://opensource.org/licenses/MIT"
                    }
                }

                developers {
                    developer {
                        id = "mork"
                        name = "MORK-RAKSA"
                        email = "raksamork097@gmail.com"
                    }
                }

                scm {
                    connection = "scm:git:git://github.com/MORK-RAKSA/wft-core.git"
                    developerConnection = "scm:git:ssh://github.com/MORK-RAKSA/wft-core.git"
                    url = "https://github.com/MORK-RAKSA/wft-core"
                }
            }
        }
    }

//    repositories {
//        maven {
//            name = "central"
//            credentials {
//                username = System.getenv("MAVEN_USERNAME")
//                password = System.getenv("MAVEN_PASSWORD")
//            }
//        }
//    }
}

signing {
    def signingKey = findProperty("signingKey")
    def signingPassword = findProperty("signingPassword")

    useInMemoryPgpKeys(signingKey, signingPassword)
    sign publishing.publications.mavenJava
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-rest'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.postgresql:postgresql'
    implementation 'io.micrometer:micrometer-tracing'
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
}


tasks.named('test') {
    useJUnitPlatform()
}


jreleaser {
    deploy {
        maven {
            mavenCentral {
                active = 'ALWAYS'
                sonatype {
                    url = "https://central.sonatype.com/api/v1/publisher"
                }
            }
        }
    }
}